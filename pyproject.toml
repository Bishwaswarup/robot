[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "go1-bezier"
version = "1.1.0"
description = "Gait-aware command timing for decentralized quadruped swarms: Bezier-trot controller, capability map and swarm layer for Unitree Go1 in MuJoCo"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["mujoco>=3.2", "numpy>=1.24"]

[project.optional-dependencies]
video = ["imageio>=2.30", "imageio-ffmpeg>=0.4"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["go1_bezier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
